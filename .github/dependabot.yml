# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    rebase-strategy: auto
    target-branch: main
    schedule:
      interval: "weekly"

  # Python dependencies (uv ecosystem)
  # Dependabot supports uv, which aligns with this repository's package manager.
  - package-ecosystem: uv
    directory: /
    rebase-strategy: auto
    target-branch: main
    # Major version should be updated manually
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    schedule: # dependabot does not support cron
      interval: monthly
      time: "12:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 3
    groups:
      # Pytorch packages are grouped into one PR
      pytorch-dependencies:
        patterns:
          - "torch"
          - "torchvision"
          - "torchaudio"
          - "cupy-cuda12x"
          - "thor-terratorch-ext"
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - torch
          - torchvision
          - torchaudio
          - cupy-cuda12x
          - thor-terratorch-ext
          - gis-utils-public* # Exclude the local package itself
    cooldown:
      default-days: 7
